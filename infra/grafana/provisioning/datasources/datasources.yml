apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: ClickHouse
    uid: ch
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: grafana
      defaultDatabase: analytics
    secureJsonData:
      password: $GRAFANA_CH_PASSWORD
