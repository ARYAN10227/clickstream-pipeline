[project]
name = "clickpipe"
version = "0.1.0"
description = "Real-time click-event pipeline: Redpanda -> Python -> ClickHouse"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka",
    "clickhouse-connect",
    "pydantic>=2",
    "pydantic-settings",
    "orjson",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "testcontainers[kafka,clickhouse]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickpipe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need running services (Redpanda, ClickHouse)",
    "e2e: end-to-end tests across the full pipeline",
]
